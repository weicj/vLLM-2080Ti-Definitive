name: CI Validation & Kernel Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-syntax:
    name: Lint & Python Bytecode Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python Compilation
        run: |
          echo "Validating bytecode compilation across repository..."
          python -m py_compile setup.py
          for f in src/**/*.py tools/*.py tests/*.py; do
            if [ -f "$f" ]; then
              echo "Compiling $f"
              python -m py_compile "$f"
            fi
          done

  doc-integrity-and-links:
    name: Documentation Integrity & Link Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Canonical URLs & Local Documentation Links
        run: |
          python - << 'EOF'
          import os, re, sys
          from pathlib import Path

          # 1. Assert no legacy turboderp/ without -org across docs
          bad_pattern = re.compile(r'https?://github\.com/turboderp/exllamav3[^\s\)\#"`>]*')
          violations = []
          for md in Path('.').glob('*.md'):
              content = md.read_text(encoding='utf-8')
              matches = bad_pattern.findall(content)
              if matches:
                  violations.append(f"{md}: {matches}")
          if violations:
              print("FAILED: Legacy turboderp/exllamav3 URLs found:", file=sys.stderr)
              for v in violations:
                  print(f"  {v}", file=sys.stderr)
              sys.exit(1)
          print("PASSED: All ExLlamaV3 URLs use canonical turboderp-org namespace.")

          # 2. Check local relative links in README.md
          readme = Path("README.md").read_text(encoding="utf-8")
          local_links = re.findall(r'\[.*?\]\((?!https?://)(.*?)\)', readme)
          missing = []
          for link in local_links:
              clean = link.split("#")[0].strip()
              if clean and not Path(clean).exists():
                  missing.append(link)
          if missing:
              print(f"FAILED: Missing local file links referenced in README: {missing}", file=sys.stderr)
              sys.exit(1)
          print(f"PASSED: All {len(local_links)} local documentation links exist.")
          EOF

  unit-tests:
    name: Unit & Attribution Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run Pytest Suite
        run: |
          python -m pytest -v

  exllamav3-aarch64-patch-test:
    name: ExLlamaV3 aarch64 Patch Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone Canonical ExLlamaV3
        run: |
          git clone --depth 1 https://github.com/turboderp-org/exllamav3.git /tmp/exllamav3_test
          git -C /tmp/exllamav3_test rev-parse HEAD

      - name: Execute patch_exllamav3_aarch64.py
        run: |
          python tools/patch_exllamav3_aarch64.py /tmp/exllamav3_test/exllamav3/exllamav3_ext --force

      - name: Assert x86 Intrinsics Guarded & Yield Replaced
        run: |
          python tools/verify_exllamav3_aarch64.py /tmp/exllamav3_test/exllamav3/exllamav3_ext

  packaging-check:
    name: Pure-Python Wheel & SDist Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install build

      - name: Build SDist and Pure-Python Wheel
        run: |
          VLLM_EXL3_NO_CUDA=1 python -m build --sdist --wheel
          ls -la dist/
